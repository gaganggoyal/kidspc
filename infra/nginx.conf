server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The client is a single-page app: every unknown path is a client route, not
  # a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin API, so the refresh cookie needs no cross-site relaxation.
  location /v1/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /stream/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # A desktop session is long-lived; the default 60s read timeout would cut
    # a child off mid-activity.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Control-plane routes are for other KidPC components only and must never be
  # reachable from a browser.
  location /internal/ {
    return 404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
